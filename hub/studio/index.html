<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOSS Studio (draft)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Playfair+Display:ital,wght@1,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#F6F3EC;--card:#fff;--ink:#14110F;--muted:#6B645C;--line:#E1DACD;--accent:#DC2E0A;--tint:#EDE6D9;--green:#1E9E5A;--shadow:0 10px 30px rgba(20,17,15,.10)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 Montserrat,system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.1;letter-spacing:-.02em}
h1{font-weight:800;font-size:clamp(1.8rem,3.4vw,2.8rem)}
h1 i{font-family:'Playfair Display',serif;color:var(--accent);font-weight:700}
h3{font-size:1.05rem;font-weight:800}
.top{display:flex;align-items:center;gap:16px;padding:12px clamp(16px,3vw,40px);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);z-index:5}
.brand{font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-.02em;cursor:pointer}
.brand i{font-family:'Playfair Display',serif;color:var(--accent)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.badge{font:700 .66rem 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;background:var(--tint);color:var(--muted);padding:4px 10px;border-radius:999px}
.sp{flex:1}
main{max-width:1280px;margin:0 auto;padding:clamp(16px,2.5vw,32px) clamp(16px,3vw,40px) 60px}
.eb{font:700 .72rem 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sub{color:var(--muted);margin:6px 0 20px}
.hero{text-align:center;margin:10px auto 34px;max-width:820px}
.hero h1{font-size:clamp(2.6rem,7vw,5rem)}
.hero.proj h1{font-size:clamp(1.5rem,3.2vw,2.4rem);line-height:1.15}
.hero .eb{font-size:.82rem}
.hero .sub{font-size:1.2rem;margin:12px auto 0}
.sect{margin-top:64px}
.sect .hero{margin-bottom:24px}
.sty2{display:flex;flex-direction:column;text-decoration:none;color:inherit;padding:0;overflow:hidden;transition:transform .15s}
.sty2:hover{transform:translateY(-3px)}
.sty2 .th{aspect-ratio:4/5;background:var(--tint) center top/cover}
.sty2 .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.sty2 p{margin:0;color:var(--muted);font-size:.82rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow)}
.h{font:700 .72rem 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.h i{color:var(--accent);font-size:18px}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.b{font:700 .82rem Montserrat,sans-serif;padding:9px 15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none}
button:hover{border-color:var(--ink)}
button.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.a{background:var(--accent);color:#fff;border-color:var(--accent)}
button.i{padding:9px 11px}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button i{font-size:16px}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=text],select,textarea{font:500 .9rem Montserrat,sans-serif;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:62px}
label.l{display:block;font:700 .72rem 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.mut{font-size:.8rem;color:var(--muted);margin:8px 0 0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.proj{cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.proj:hover{transform:translateY(-3px)}
.proj .th{aspect-ratio:16/9;border-radius:14px;background:var(--tint) center top/cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:34px}
.newc{border:2px dashed var(--line);box-shadow:none;align-items:center;justify-content:center;min-height:200px;color:var(--muted);text-align:center}
.styles{display:flex;gap:14px;margin-top:6px;align-items:flex-start}.styles>.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
#stylepick{width:100vw;margin-left:calc(50% - 50vw);padding:0 clamp(12px,2vw,28px);box-sizing:border-box}body{overflow-x:clip}
.sty{cursor:pointer;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.sty .th{background:var(--tint);position:relative}
.sty .th img{display:block;width:100%;height:auto;min-height:120px}
.sty .th video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sty .th video:fullscreen,.sty .th video:-webkit-full-screen{object-fit:contain;background:#000}
.sty .th .use{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,17,15,.45);opacity:0;transition:opacity .15s}
.sty:hover .th .use{opacity:1}
.sty .th .use span{background:var(--ink);color:var(--bg);font:700 .78rem Montserrat,sans-serif;padding:9px 16px;border-radius:999px}
.sty .th [data-fsvideo]{position:absolute;top:8px;right:8px;z-index:2;background:rgba(20,17,15,.55);color:#fff;border:0;border-radius:50%;width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.sty:hover .th [data-fsvideo]{opacity:1}
.sty b{display:block;padding:8px 10px;font-size:.82rem;text-align:center}
.sty.on{border-color:var(--accent)}
.drop{border:2px dashed var(--line);border-radius:18px;padding:16px 18px;color:var(--muted);cursor:pointer;background:#fff;display:flex;align-items:center;gap:14px;text-align:left}
.drop .dicon{width:44px;height:44px;border-radius:12px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink);flex:none}
.drop .dtext{flex:1;min-width:0}
.drop .dtext b{display:block;font-size:.95rem;color:var(--ink);overflow-wrap:anywhere}
.drop .dtext small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.drop .ok-mark{color:var(--green);font-size:22px;flex:none}
.drop .b{flex:none}
.drop.ok{border-color:var(--green);color:var(--green)}
.drop.dragover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,#fff)}
.err{border-color:var(--accent) !important}
.ws{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
@media(max-width:900px){.ws{grid-template-columns:1fr}}
.stage{background:var(--tint);border-radius:18px;padding:14px;display:flex;justify-content:center;position:relative}
.stage video,.stage .cv{max-height:min(34vh,400px);max-width:100%;border-radius:12px;background:#000;display:block}
.stage .cv{position:relative}
.stage canvas{display:block;max-height:min(34vh,400px);max-width:100%;border-radius:12px;touch-action:none}
.stage .ink{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.empty{aspect-ratio:9/16;max-height:min(34vh,400px);width:min(100%,300px);border-radius:12px;background:#fff;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:8px;padding:16px;text-align:center}
.scrub{position:relative;height:24px;margin:14px 2px 8px;cursor:pointer}
.scrub .tr{position:absolute;top:10px;left:0;right:0;height:6px;border-radius:3px;background:var(--line)}
.scrub .fl{position:absolute;top:10px;left:0;height:6px;border-radius:3px;background:var(--accent)}
.scrub .ph{position:absolute;top:2px;width:3px;height:22px;border-radius:2px;background:var(--ink)}
.scrub .mk{position:absolute;top:16px;width:9px;height:9px;border-radius:50%;background:var(--ink);margin-left:-4px}
.col{display:flex;flex-direction:column;gap:16px}
.n{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;background:var(--tint);border-radius:14px;padding:8px 10px}
.n img{width:44px;height:78px;object-fit:cover;border-radius:8px;flex:none;border:1px solid var(--line)}
.n .t{font:700 .7rem 'JetBrains Mono',monospace;background:var(--ink);color:var(--bg);border-radius:7px;padding:3px 8px;cursor:pointer}
.n .x{margin-left:auto;padding:4px 6px;border:0;background:transparent;color:var(--muted)}
.tag{font:700 .62rem 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:#fff;padding:3px 9px;border-radius:999px;margin-top:4px;display:inline-block}
.stybar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 14px 8px 8px;max-width:520px;margin:0 auto 22px;box-shadow:var(--shadow)}
.stybar .th{width:46px;height:58px;border-radius:10px;background:var(--tint) center top/cover;flex:none}
.stybar small{display:block;font:700 .62rem 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stybar b{display:block;font-size:.95rem}
.stybar select{width:auto;margin-left:auto;padding:7px 10px;font-size:.78rem}
.styline{display:flex;justify-content:center;align-items:baseline;gap:8px;font-size:1rem;margin:-4px 0 20px;flex-wrap:wrap}.styline small,.styline b,.styline span{font:inherit}.styline small,.styline span{font-weight:500;color:var(--muted)}.styline b{font-weight:800}
.stybar.inner{max-width:none;margin:0 0 14px;box-shadow:none;background:var(--tint);border:0}
.steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 22px}
.steps span[data-step]:hover{outline:2px solid var(--ink)}
.steps span{font:700 .72rem 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:var(--tint);color:var(--muted)}
.steps .on{background:var(--ink);color:var(--bg)}.steps .done{background:var(--green);color:#fff}
.fg{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));width:100%}
.fr{padding:0;border:2px solid transparent;border-radius:12px;overflow:hidden;background:#fff;position:relative;cursor:pointer;display:block}
.fr:hover{border-color:var(--ink)}.fr.hasnote{border-color:var(--accent)}
.fr img{display:block;width:100%;height:auto}
.fr span{position:absolute;left:6px;bottom:6px;font:700 .64rem 'JetBrains Mono',monospace;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 6px}
.fr i{position:absolute;right:6px;top:6px;background:var(--accent);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center}
.run{display:flex;gap:12px;align-items:center;max-width:760px;margin:0 auto 20px;background:#fff;border:1px solid var(--accent);border-radius:16px;padding:10px 14px}
.run[hidden]{display:none}.run.err{border-color:#E24B4A;color:#A32D2D}
.run small{color:var(--muted);display:block;max-width:560px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run i{color:var(--accent);font-size:22px}.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.run button{margin-left:auto}
.locked .scrub,.locked .r button{pointer-events:none;opacity:.4}
.proj{position:relative}.pact{position:absolute;top:22px;right:22px;display:flex;gap:6px}.pact button{padding:7px 8px;background:#fff;box-shadow:0 2px 8px rgba(20,17,15,.2)}
.ws.land:not(.ws3):not(.ws2){grid-template-columns:1fr}.ws.land:not(.ws3):not(.ws2)>section.c{max-width:860px;width:100%;margin:0 auto}
.ws.land:not(.ws3):not(.ws2) .col{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.ws.land:not(.ws3):not(.ws2) .stage video,.ws.land:not(.ws3):not(.ws2) .stage .cv,.ws.land:not(.ws3):not(.ws2) .stage canvas{max-height:min(40vh,420px)}
.ws.land:not(.ws3):not(.ws2) .fg{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
/* Editing page (ws3) in landscape: real three columns, full width, wider video column — not the
   stacked single-column layout above, which is for the older two-column pages (Script/Instructions) */
main.wide3.landwide{max-width:none}
@media(min-width:1301px){.ws3.land{grid-template-columns:minmax(0,1.1fr) minmax(260px,1fr) minmax(300px,1.1fr)}}
.empty.wide{aspect-ratio:16/9;width:min(100%,520px)}
.galgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.gc{background:var(--tint);border-radius:16px;overflow:hidden}.gc video{width:100%;max-height:340px;background:#000;display:block}
.gb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}.gb small{color:var(--muted);font-size:.72rem;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:.85rem;z-index:50;max-width:90vw}
.toast[hidden]{display:none}
/* First instruction: editing option checkboxes */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:0 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,#fff)}
.opt input{accent-color:var(--accent);width:18px;height:18px;margin:2px 0 0;flex:none}
.opt b{display:block;font-size:.88rem}
.opt small{display:block;color:var(--muted);font-size:.76rem;line-height:1.35}
.vonote{display:flex;gap:10px;align-items:flex-start;background:#FFF4E5;border:1px solid #F0B35B;border-radius:14px;padding:10px 12px;margin:0 0 12px;font-size:.84rem;line-height:1.45}
.vonote i{color:#C26A00;font-size:18px;flex:none;margin-top:1px}
/* First instruction: a reference video whose editing BOSS copies */
.refbox{background:var(--tint);border-radius:16px;padding:12px 14px;margin:-6px 0 14px}
.refbox small{display:block;font:700 .62rem 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.refbox .r{flex-wrap:nowrap}
.refbox input[type=text]{flex:1;min-width:0;padding:8px 12px;border-radius:999px}
.refbox .refon{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--accent);border-radius:12px;padding:8px 10px;margin-top:8px;font-size:.85rem;overflow-wrap:anywhere}
.refbox .refon i{color:var(--accent)}
.refbox .refon button{margin-left:auto;padding:4px 6px;border:0;background:transparent;color:var(--muted)}
@media(max-width:560px){.refbox .r{flex-wrap:wrap}.refbox input[type=text]{flex-basis:100%}}
/* Editing page: video, Script and Revision notes side by side, so the page runs wider than usual.
   Mobile sizing for this is a later pass; for now it just folds down like every other .ws does. */
main.wide3{max-width:1680px}
@media(min-width:1301px){.ws3{grid-template-columns:minmax(0,1fr) minmax(260px,.95fr) minmax(300px,1.05fr)}}
@media(max-width:1300px){.ws3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ws3>#editmid{grid-column:span 2}}
@media(max-width:900px){.ws3{grid-template-columns:1fr}}
/* Script step: the transcript is the edit */
.scr{max-height:min(58vh,620px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1rem;line-height:1.9;user-select:none;outline:none}
.scr p{margin:0 0 12px}
.scr .w,.scr .pz{border-radius:5px;padding:1px 1px;cursor:pointer}
.scr .w:hover,.scr .pz:hover{background:var(--tint)}
.scr .pz{font:700 .7rem 'JetBrains Mono',monospace;color:var(--muted);background:var(--tint);padding:2px 6px;margin:0 3px}
.scr .sug{background:#FCEFC7;box-shadow:inset 0 -2px #E0A800}
.scr .cut{text-decoration:line-through;text-decoration-thickness:2px;color:#B4ADA3;background:#FBE3DD}
.scr .sel{background:var(--ink)!important;color:var(--bg)!important}
.scr .now{background:var(--accent);color:#fff;text-decoration:none}
.scrub .cx{position:absolute;top:8px;height:10px;background:#E24B4A;opacity:.75;border-radius:2px;pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(20,17,15,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
.modal[hidden]{display:none}
.modal .c{max-width:720px;width:100%}
.modal pre{white-space:pre-wrap;font:500 .82rem/1.55 'JetBrains Mono',monospace;background:var(--tint);border-radius:14px;padding:14px;max-height:50vh;overflow:auto;margin:0 0 12px}
/* portrait: the player stays a fixed, sane height regardless of how tall the modules beside it get */
@media(min-width:901px){
  .ws:not(.land)>section.c,.ws3.land>section.c,.ws2.land>section.c{display:flex;flex-direction:column}
  .ws:not(.land) .stage,.ws3.land .stage,.ws2.land .stage{flex:1;min-height:0}
  .ws:not(.land) .stage:has(video),.ws3.land .stage:has(video),.ws2.land .stage:has(video){position:relative;min-height:700px;max-height:700px}
  .ws:not(.land) .stage video,.ws3.land .stage video,.ws2.land .stage video{position:absolute;left:14px;top:14px;width:calc(100% - 28px);height:calc(100% - 28px);max-height:none;max-width:none;object-fit:contain;background:transparent}
  .ws:not(.land) .stage canvas,.ws:not(.land) .stage .cv,.ws3.land .stage canvas,.ws3.land .stage .cv,.ws2.land .stage canvas,.ws2.land .stage .cv{max-height:700px}
}
/* annotating a snapshot: the whole workspace becomes a full-screen overlay — big frame on the left, the same
   draw tools + note form on the right — so nothing is moved in the DOM and every handler keeps working */
button.g{background:var(--green);border-color:var(--green);color:#fff}button.g:disabled{opacity:.45}
details.more{margin:0 0 4px}details.more>summary{cursor:pointer;font-size:.8rem;font-weight:700;color:var(--muted);padding:4px 0;list-style-position:inside}
.annx{position:absolute;top:22px;right:24px;z-index:3;width:34px;height:34px;padding:0;border-radius:50%;background:#fff;border:1px solid var(--line)}
.annx:hover{background:var(--ink);color:#fff}
body.annot{overflow:hidden}
body.annot .stage{overflow:hidden}
body.annot .top{display:none}
body.annot .ws{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:max-content;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);z-index:25;background:var(--bg);border-radius:22px;box-shadow:0 0 0 100vmax rgba(20,17,15,.6);overflow:auto;padding:14px;gap:14px;grid-template-columns:max-content 420px !important}
body.annot .ws>section.c:first-child{padding:0;border:0;background:none;box-shadow:none}
body.annot .stage canvas{max-width:calc(100vw - 520px) !important}
body.annot .ws>#editmid,body.annot .ws .scrub,body.annot .ws .col>section:not(:has(#tools)){display:none}
body.annot .pctl{display:none}
.cvw{display:flex;flex-direction:column;align-items:center;max-width:100%}
.annbar{display:flex;align-items:center;gap:8px;margin-top:12px;width:100%;min-width:300px}
.annbar input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.annbar .tm{font:700 .78rem 'JetBrains Mono',monospace;color:var(--muted);min-width:54px;text-align:right}
body.annot .stage canvas,body.annot .stage .cv{max-height:min(820px,calc(100vh - 190px)) !important}
@media(max-width:900px){body.annot .ws{grid-template-columns:1fr !important;width:calc(100vw - 24px)}body.annot .stage canvas{max-width:100% !important}}
/* subtle drifting grid behind the projects list and new-project page */
body.gridbg::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(color-mix(in srgb,var(--line) 70%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 70%,transparent) 1px,transparent 1px);background-size:42px 42px;animation:gridshift 70s linear infinite}
/* New-project page: dark stage, light text for everything that is not inside a card */
body.darknew{background:#14110F;--line:#2A2520}
body.darknew .hero,body.darknew .hero h1,body.darknew .hero .sub,body.darknew .hero b{color:#F6F3EC}
body.darknew .hero .eb,body.darknew #stylepick>label.l{color:#A89F93}
body.darknew .hero .sub{color:#CFC8BC}
body.darknew .hero .sub b{color:#FF6B3D!important}
body.darknew .top{background:rgba(20,17,15,.9);color:#F6F3EC}
body.darknew .top b{color:#F6F3EC}
body.darknew .hero h1 i{color:#FF6B3D}
body.darknew .c,body.darknew .sty,body.darknew .sty b{color:var(--ink)}

<body>

<div id="cfm" class="modal" hidden><div class="c" style="max-width:460px"><p id="cfmtext" style="margin:0 0 14px;font-weight:600"></p><div class="r"><button class="a" id="cfmyes">Yes, delete</button><button id="cfmno">Cancel</button></div></div></div>
<div id="modal" class="modal" hidden><div class="c"><p class="h"><i class="ti ti-send"></i><span id="mtitle">Revision request</span></p><pre id="prompt"></pre><div class="r"><button class="a" data-act="copyprompt"><i class="ti ti-copy"></i>Copy prompt</button><button data-act="closemodal">Close</button></div><p class="mut">Draft prototype: this window only gives you the prompt. Copy it into a BOSS chat in this workspace. The raw video and snapshots are not saved to a project folder yet, so tell BOSS where your video file is.</p></div></div>
<div id="stymodal" class="modal" hidden><div class="c" id="stymodalbody"></div></div>
<script src="../data.js"></script>
<script src="../my-styles.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const FR = parent !== window; // framed inside the hub page
let MAINTAINER = false; // true only on the repo owner's copy (a .maintainer file): their saved styles go into the shared set
const HUBD = window.HUB || parent.HUB; // the hub data: loaded by ../data.js, or the parent page's
const P = location.protocol === 'about:' ? '' : '../'; // asset prefix: the hosted copy is a srcdoc next to assets/
const STY = HUBD.styles;
const styName = (id) => (id ? (STY.find((s) => s.id === id) || {}).name || 'No style' : 'Custom');
const fmt = (t) => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
const fmtDur = (ms) => { const s = Math.round(ms / 1000); return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + (s % 60) + 's'; };
// target-platform presets: [id, label, ratio label, width, height]. A project keeps a snapshot of
// whichever one it picked (id/label/w/h), so editing this list later never changes an existing project.
const FORMATS = [
  ['tiktok', 'TikTok', '9:16', 1080, 1920],
  ['reels', 'Instagram Reels', '9:16', 1080, 1920],
  ['shorts', 'YouTube Shorts', '9:16', 1080, 1920],
  ['igstory', 'Instagram Story', '9:16', 1080, 1920],
  ['igfeed', 'Instagram Feed', '4:5', 1080, 1350],
  ['youtube', 'YouTube', '16:9', 1920, 1080],
  ['linkedin', 'LinkedIn', '1:1', 1080, 1080],
  ['x', 'X', '16:9', 1920, 1080],
  ['classic', 'Classic 4:3', '4:3', 1440, 1080],
  ['portrait34', 'Portrait 3:4', '3:4', 1080, 1440],
  ['cinematic', 'Cinematic 21:9', '21:9', 2560, 1080],
].map(([id, label, ratio, w, h]) => ({id, label, ratio, w, h}));
const formatById = (id) => FORMATS.find((f) => f.id === id);
// most style guides state their ratio as the first entry in `formats`, e.g. "9:16 vertical" or "16:9 horizontal"
function styleRatio(sty) {
  const text = (sty && sty.formats || []).join(' ');
  return ['9:16', '16:9', '4:5', '1:1', '4:3', '3:4', '21:9'].find((r) => text.includes(r)) || '9:16';
}
const defaultFormatFor = (sty) => FORMATS.find((f) => f.ratio === styleRatio(sty)) || FORMATS[1];
const projectFormat = (p) => (p.format && p.format.w && p.format.h ? p.format : { label: 'TikTok', ratio: '9:16', w: 1080, h: 1920 });
const draftSizeText = (p) => { const f = projectFormat(p); return Math.round(f.w * 0.9) + 'x' + Math.round(f.h * 0.9); };
const finalSizeText = (p) => { const f = projectFormat(p); return f.w + 'x' + f.h; };
const RANGES = ['This frame only', 'Next 5 seconds', 'Next 10 seconds', 'Whole section', 'Custom'];
const fmtp = (t) => fmt(t) + '.' + Math.floor((t % 1) * 10); // one decimal, for a word-accurate time
const rangeLabel = (n) => n.range === 'Custom' && Number.isFinite(n.rangeStart) ? fmtp(n.rangeStart) + '–' + fmtp(n.rangeEnd) : n.range;

// ---- storage: projects in localStorage, raw video files in IndexedDB (draft: stays inside this browser)
const load = () => { try { return JSON.parse(localStorage.getItem('studio.projects') || '[]'); } catch { return []; } };
let API = false; // true when the local studio server is running: projects live in projects/<name>/
const H = {'x-studio': '1'};
const FILEMGR = /Mac/i.test(navigator.platform) ? 'Finder' : 'File Explorer';
const jf = async (m, u, b) => { const r = await fetch(u, {method: m, headers: b ? {...H, 'content-type': 'application/json'} : H, body: b ? JSON.stringify(b) : undefined}); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status); return r.json(); };
const voUrl = (p) => (API && p.voiceoverFile ? '/projects/' + p.id + '/voiceover/' + encodeURIComponent(p.voiceoverFile) : null);
const voCut = (p) => /voiceover-edited/.test(p.cutFile || ''); // the Script step cut the voiceover, not the video
const rawUrl = (p) => (API && p.rawName ? '/projects/' + p.id + '/raw/' + encodeURIComponent(p.rawName) : null);
const openUrl = async (p) => { if (API) return rawUrl(p); const f = await getRaw(p.id); return f ? URL.createObjectURL(f) : null; };
async function upload(p, f) { const r = await fetch('/api/projects/' + p.id + '/raw?name=' + encodeURIComponent(f.name), {method: 'PUT', headers: H, body: f}); if (!r.ok) throw new Error('upload failed'); Object.assign(p, await r.json()); }
async function uploadVO(p, f) { const r = await fetch('/api/projects/' + p.id + '/voiceover?name=' + encodeURIComponent(f.name), {method: 'PUT', headers: H, body: f}); if (!r.ok) throw new Error('upload failed'); Object.assign(p, await r.json()); }
// one video, or several clips joined in the order chosen on the New Project screen
async function uploadDraftVideo(p) {
  if (draftNew.files && draftNew.files.length > 1) {
    toast('Joining ' + draftNew.files.length + ' clips…');
    const partNames = draftNew.files.map((f, i) => 'part-' + String(i + 1).padStart(2, '0') + (/\.[^.]+$/.exec(f.name) || ['.mp4'])[0]);
    for (let i = 0; i < draftNew.files.length; i++) {
      const r = await fetch('/api/projects/' + p.id + '/rawpart?name=' + encodeURIComponent(partNames[i]), {method: 'PUT', headers: H, body: draftNew.files[i]});
      if (!r.ok) throw new Error('upload failed: ' + draftNew.files[i].name);
    }
    Object.assign(p, await jf('POST', '/api/projects/' + p.id + '/concat', {files: partNames}));
  } else if (draftNew.file) await upload(p, draftNew.file);
}
// one or more reference links pasted on the New Project screen itself, before the project exists
async function applyNewRefLinks(p) {
  const vals = [...document.querySelectorAll('.reflinkrow')].map((i) => i.value.trim()).filter(Boolean);
  if (!vals.length) return;
  const bad = vals.find((u) => !/^https?:\/\/\S+$/i.test(u));
  if (bad) return toast('Reference link ignored — paste a full link that starts with https://: ' + bad);
  Object.assign(p, {refLinks: vals}); await jf('PUT', '/api/projects/' + p.id, p);
}
// the instructions box on the New Project screen: a one-time copy into the Instructions step's text,
// appended if there's already a brief (not a live-synced duplicate — see hub/studio/NEXT-BUILD-NOTES.md item 4)
async function applyNewInstructions(p) {
  const instr = (($('#pinstr') || {}).value || '').trim(); if (!instr) return;
  p.brief = p.brief ? p.brief + '\n\n' + instr : instr;
  if (API) await jf('PUT', '/api/projects/' + p.id, p);
}
const save = () => { if (API) { if (cur) jf('PUT', '/api/projects/' + cur.id, cur).catch(() => toast('Could not save to the project folder')); return; } try { localStorage.setItem('studio.projects', JSON.stringify(projects)); } catch { toast('Could not save: browser storage is full'); } };
let projects = load();
const idb = () => new Promise((ok, no) => { const q = indexedDB.open('studio', 1); q.onupgradeneeded = () => q.result.createObjectStore('raw'); q.onsuccess = () => ok(q.result); q.onerror = no; });
const putRaw = async (id, f) => { const d = await idb(); d.transaction('raw', 'readwrite').objectStore('raw').put(f, id); };
const delRaw = async (id) => { const d = await idb(); d.transaction('raw', 'readwrite').objectStore('raw').delete(id); };
const getRaw = async (id) => { const d = await idb(); return new Promise((ok) => { const q = d.transaction('raw').objectStore('raw').get(id); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); };

let view = 'list', cur = null, draftNew = {name: '', styleId: '', file: null, vofile: null, files: [], refLinks: [''], instructions: '', format: defaultFormatFor(undefined).id, formatTouched: false}, tool = 'pen', shapes = [], snap = null, vurl = null;
let annotating = false; // snap can be a plain preview (frame click, no draft yet); drawing tools only show once this is true
// re-rendering the New Project screen (e.g. after picking a style or reordering clips) would otherwise wipe out whatever was typed in the name/reference-link fields
function keepNewFormText() { if ($('#pname')) draftNew.name = $('#pname').value; if ($('#pinstr')) draftNew.instructions = $('#pinstr').value; const rows = [...document.querySelectorAll('.reflinkrow')]; if (rows.length) draftNew.refLinks = rows.map((r) => r.value); }
// flags a field red so a missing-input toast isn't the only sign something's wrong; clears itself once touched
function flagErr(sel) { const el = $(sel); if (el) { el.classList.add('err'); el.addEventListener(el.tagName === 'DIV' ? 'click' : 'input', () => el.classList.remove('err'), {once: true}); } return el; }
const INK_COLORS = ['#E24B4A', '#14110F', '#1E9E5A', '#2E6FDC', '#F0B33D', '#ffffff'];
const INK_SIZES = [0.6, 1, 1.8]; // thin, medium (the old fixed look), thick
let inkColor = INK_COLORS[0], inkSize = 1;
const app = $('#app');
function askConfirm(msg, yesLabel, noLabel) { return new Promise((ok) => { const m = $('#cfm'); $('#cfmtext').textContent = msg; $('#cfmyes').textContent = yesLabel || 'Yes, delete'; $('#cfmno').textContent = noLabel || 'Cancel'; m.hidden = false; const done = (v) => { m.hidden = true; ok(v); }; $('#cfmyes').onclick = () => done(true); $('#cfmno').onclick = () => done(false); }); }
function isFacelessStyle(id) { const s = STY.find((x) => x.id === id); return !!(s && s.faceless); }
async function confirmFacelessMismatch() {
  if (!draftNew.file || !isFacelessStyle(draftNew.styleId)) return true;
  return askConfirm('Heads up — this style is faceless. We\'ll pull the audio from your video as narration and build the edit around motion graphics instead of the footage itself. Your face won\'t appear in the final video.', 'Continue anyway', 'Pick a different style');
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 2600); }
const pushStep = () => history.pushState({view, pid: cur && cur.id, phase: cur && (cur.phase || 'brief'), annot: !!snap}, '');
function go(v, p, pop) { pendingRefs = []; clearInterval(poller); poller = null; runSt = null; runLabel = ''; view = v; cur = p || null; snap = null; $('#crumb').textContent = p ? p.name : ''; render(); window.scrollTo(0, 0); if (!pop) pushStep(); }
let notesDirty = false; // notes were added while the floating canvas stayed open: re-render once it closes so buttons and counts catch up
function finishAnnot() { snap = null; gv = null; seekWant = null; stage(); if (notesDirty) { notesDirty = false; project(); } }
function closeAnnot() { annotating = false; if (history.state && history.state.annot) history.back(); else finishAnnot(); }
addEventListener('keydown', (e) => { if (e.key === 'Escape' && snap && annotating && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && !document.querySelector('.modal:not([hidden])')) closeAnnot(); });
window.addEventListener('popstate', async (e) => {
  const st = e.state || {view: 'list'}, ph = st.phase || 'brief';
  if (st.view === 'project' && cur && cur.id === st.pid && (cur.phase || 'brief') === ph) { if (snap && !st.annot) finishAnnot(); return; }
  if (st.view !== 'project') return go(st.view || 'list', null, true);
  const p = projects.find((y) => y.id === st.pid); if (!p) return go('list', null, true);
  vurl = await openUrl(p); await ensureOrient(p); p.phase = ph; save(); frames = []; go('project', p, true);
});

// ---- screens
// Masonry: put each card in the shortest column, at its natural height, so no column ends far above the rest.
function layoutStyles() {
  const box = document.querySelector('.styles'); if (!box || document.fullscreenElement) return; // moving a fullscreen video out of its parent would exit fullscreen
  const cards = box._cards || (box._cards = [...box.querySelectorAll('.sty')]);
  const n = Math.max(2, Math.floor(box.clientWidth / 250)), cols = [];
  if (box._n === n && !box._force) return; box._n = n;
  box.replaceChildren(...Array.from({length: n}, () => { const c = document.createElement('div'); c.className = 'col'; cols.push(c); return c; }));
  cards.forEach((c) => { cols.reduce((a, b) => (b.offsetHeight < a.offsetHeight ? b : a)).append(c); });
}
addEventListener('resize', () => { if (document.fullscreenElement) return; clearTimeout(layoutStyles.t); layoutStyles.t = setTimeout(layoutStyles, 120); });
// Style cards autoplay a short loop from the style's own sample video once visible, instead of
// decoding all of them at once; falls back to the static cover (already the background) if missed.
function watchStyleVideos() {
  const vids = [...document.querySelectorAll('.sty .th video[data-src]')];
  if (!vids.length) return;
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      const v = e.target;
      if (e.isIntersecting) {
        if (!v.src) v.src = v.dataset.src;
        const at = +v.dataset.at || 0;
        if (!v._seeked) { v._seeked = true; v.addEventListener('loadedmetadata', () => (v.currentTime = at), {once: true}); v.addEventListener('timeupdate', () => { if (v.currentTime - at > 4) v.currentTime = at; }); }
        v.play().catch(() => {});
      } else v.pause();
    });
  }, {threshold: 0.4});
  vids.forEach((v) => io.observe(v));
}
function render() {
  document.body.classList.toggle('gridbg', view === 'list' || view === 'new'); document.body.classList.toggle('darknew', view === 'new');
  if (view === 'list') {
    app.innerHTML = `<div class="hero"><div class="eb">Projects</div><h1>Your <i>projects</i></h1><p class="sub">Each project is its own folder with its raw video, drafts and revision notes.</p></div>
    <div class="grid"><div class="c proj newc" data-go="new"><i class="ti ti-plus" style="font-size:34px;color:var(--accent)"></i><h3>New project</h3><span class="mut">Upload a raw video and pick a style</span></div>
    ${projects.map((p) => { const s = STY.find((x) => x.id === p.styleId) || {}; return `<div class="c proj" data-open="${p.id}"><div class="pact"><button data-dup="${p.id}" title="Duplicate"><i class="ti ti-copy"></i></button><button data-delproj="${p.id}" title="Delete"><i class="ti ti-trash"></i></button></div><div class="th" style="background-image:${API && p.thumb ? `url('/projects/${p.id}/${p.thumb}'),` : ''}url('${P}${s.cover || ''}')${API && p.thumb ? ';background-position:center center,center top;background-size:contain,cover' : ''}"></div><h3>${esc(p.name)}</h3><span class="mut" style="margin:0">${esc(styName(p.styleId))} · ${p.notes.length} notes</span></div>`; }).join('')}</div>`;
  } else if (view === 'new') {
    const multiFiles = draftNew.files && draftNew.files.length > 1;
    const fileList = draftNew.files && draftNew.files.length > 0;
    app.innerHTML = `<div class="hero"><div class="eb">New project</div><h1>Create like a <i>BOSS</i></h1><p class="sub" style="font-size:1.35rem">Upload a <b style="color:var(--ink)">video</b> to edit the person on camera, or just a <b style="color:var(--ink)">voiceover</b> to build a faceless video around it.</p></div>
    <div class="c" style="max-width:860px;margin:0 auto"><label class="l" style="margin-top:0;color:var(--ink);font:700 .95rem Montserrat,sans-serif;letter-spacing:normal;text-transform:none">Project name</label><input type="text" id="pname" placeholder="Enter the name of the project" value="${esc(draftNew.name)}">
    <label class="l" style="color:var(--ink);font:700 .95rem Montserrat,sans-serif;letter-spacing:normal;text-transform:none">Media <span class="mut" style="font-weight:500">(video or audio, optional)</span></label>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div class="drop ${(draftNew.file || draftNew.vofile) ? 'ok' : ''}" id="dropmedia" style="flex:1;min-width:240px"><div class="dicon"><i class="ti ${draftNew.vofile && !draftNew.file ? 'ti-microphone' : 'ti-video'}"></i></div><div class="dtext"><b>${multiFiles ? draftNew.files.length + ' videos selected' + (draftNew.vofile ? ' + ' + esc(draftNew.vofile.name) : '') : [draftNew.file ? esc(draftNew.file.name) : '', draftNew.vofile ? esc(draftNew.vofile.name) : ''].filter(Boolean).join(' + ') || 'Drop your video or audio here'}</b><small>${multiFiles ? 'Joined into one video, in the order below' : 'mp4, avi, mov, wav, mp3'}</small></div>${(draftNew.file || draftNew.vofile) ? '<i class="ti ti-circle-check ok-mark"></i>' : ''}<button type="button" class="b">Browse files</button></div><input type="file" id="filemedia" accept=".mp4,.avi,.mov,.wav,.mp3" multiple hidden>
      <button class="a" id="btncreate" data-act="create" style="padding:16px 22px;font-size:1rem"${(!draftNew.name.trim() || !(draftNew.file || draftNew.vofile)) ? ' disabled' : ''}><i class="ti ti-folder-plus"></i>Create project</button>
      <button class="p" id="btnmagic" data-act="magicedit" style="padding:16px 22px;font-size:1rem"${(!draftNew.name.trim() || !(draftNew.file || draftNew.vofile)) ? ' disabled' : ''}><i class="ti ti-wand" style="color:var(--accent)"></i>Magic Edit</button>
    </div>
    ${fileList ? '<p class="mut" style="margin:8px 0 4px">' + (multiFiles ? 'Arrange the order these clips play in — they\'ll be joined into one video before anything else happens.' : 'Drop or browse more clips to join them, in order.') + '</p><div style="display:flex;flex-direction:column;gap:6px">' + draftNew.files.map((f, i) => '<div class="n" style="justify-content:space-between"><span style="overflow-wrap:anywhere">' + (i + 1) + '. ' + esc(f.name) + '</span><span class="r" style="gap:2px"><button class="i" data-reorder="up" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + ' title="Move up"><i class="ti ti-arrow-up"></i></button><button class="i" data-reorder="down" data-i="' + i + '"' + (i === draftNew.files.length - 1 ? ' disabled' : '') + ' title="Move down"><i class="ti ti-arrow-down"></i></button><button class="i" data-reorder="rm" data-i="' + i + '" title="Remove"><i class="ti ti-x"></i></button></span></div>').join('') + '</div>' : ''}
    <p class="mut" style="margin:6px 0 0">Magic Edit: BOSS decides everything — cuts, style, render — with no review until it's done.</p>
    <p class="mut" style="margin:4px 0 0">At least one file is needed. This choice is final for the project — there's no timeline editor here to add or swap footage later.</p>
    <label class="l" style="color:var(--ink);font:700 .95rem Montserrat,sans-serif;letter-spacing:normal;text-transform:none">Your Vision. Your Story (Write Your First Prompt)</label>
    <textarea id="pinstr" rows="3" placeholder="e.g. Cut it fast, add bold captions, use Pastel Punch">${esc(draftNew.instructions || '')}</textarea>
    <p class="mut" style="margin:14px 0 0;font-size:.95rem"><b style="color:var(--ink);font:700 .95rem Montserrat,sans-serif">Style</b> ${esc(styName(draftNew.styleId))}</p>
    <label class="l" style="color:var(--ink);font:700 .95rem Montserrat,sans-serif;letter-spacing:normal;text-transform:none">Format <span class="mut" style="font-weight:500">(where this will be posted — sets the render size)</span></label>
    <select id="pformat">${FORMATS.map((f) => '<option value="' + f.id + '"' + (f.id === draftNew.format ? ' selected' : '') + '>' + esc(f.label) + ' · ' + f.ratio + '</option>').join('')}</select>
    <div class="refbox" style="margin-top:10px"><label class="l" style="margin:0 0 8px;color:var(--ink);font:700 .95rem Montserrat,sans-serif;letter-spacing:normal;text-transform:none">Reference Link(s) <span class="mut" style="font-weight:500">· copy the editing of one or more reference videos (optional)</span></label>${draftNew.refLinks.map((v, i) => '<div class="r" style="margin-bottom:6px"><input type="text" class="reflinkrow" data-i="' + i + '" placeholder="Paste a YouTube, TikTok or Instagram link" value="' + esc(v) + '">' + (draftNew.refLinks.length > 1 ? '<button class="i" data-rmreflink="' + i + '" title="Remove"><i class="ti ti-x"></i></button>' : '') + '</div>').join('')}<button type="button" data-act="addreflinkrow"><i class="ti ti-plus"></i>Add another link</button><p class="mut" style="margin:8px 0 0">Copying a reference link takes longer than picking a style below — BOSS has to download and study each video first, instead of using an already-built template.</p></div>
    </div>
    <div id="stylepick" style="margin-top:28px"><label class="l" style="margin-top:0;text-align:center;display:block">Style</label><div class="styles"><div class="sty ${draftNew.styleId === '' ? 'on' : ''}" data-sty=""><div class="th" style="aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:34px"><i class="ti ti-scissors"></i><div class="use"><span>Use this style</span></div></div><b>Custom</b></div>${STY.map((s) => { const sm = s.samples && s.samples[0]; return `<div class="sty ${s.id === draftNew.styleId ? 'on' : ''}" data-sty="${s.id}"><div class="th"><img src="${P}${s.cover}" alt="">${sm ? `<video muted loop playsinline preload="none" data-src="${P}${sm.src}" data-at="${sm.at || 0}"></video><button class="i" data-fsvideo="1" title="Watch the full video"><i class="ti ti-maximize"></i></button>` : ''}<div class="use"><span>Use this style</span></div></div><b>${esc(s.name)}</b></div>`; }).join('')}</div></div>
    <div class="r" style="margin-top:20px;justify-content:center"><button data-go="list">Cancel</button></div>`;
    layoutStyles(); document.querySelectorAll('.styles img').forEach((i) => i.complete || i.addEventListener('load', () => { const b = document.querySelector('.styles'); if (b) b._n = 0; layoutStyles(); }, {once: true}));
    watchStyleVideos();
  } else project();
}

const ORDER = ['script', 'brief', 'frames', 'approved', 'gallery'];
// each run that makes a new version keeps its notes, style and base, so a version can be reopened with its context

// shared by the file picker (#filemedia change) and dragging files onto #dropmedia
function handleMediaFiles(fileList) {
  const files = [...fileList], AUDIO = /\.(mp3|wav)$/i, VIDEO = /\.(mp4|avi|mov)$/i;
